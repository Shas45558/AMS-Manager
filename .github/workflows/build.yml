name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bootstrap Gradle wrapper
        run: |
         gradle wrapper --gradle-version 8.9
         chmod +x ./gradlew
      - name: Prepare Gradle
        run: chmod +x ./gradlew

      - name: Prepare release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Missing GitHub secret RELEASE_KEYSTORE_BASE64."
            echo "Create a release keystore, base64-encode it, and add these repository secrets:"
            echo "RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true clean assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk school-manager-release.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-manager-release
          path: school-manager-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Replace latest release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete release --yes --cleanup-tag || true
          gh release create release school-manager-release.apk \
            --title "AMS Manager Release" \
            --notes "Latest signed release APK built from commit ${{ github.sha }}."
