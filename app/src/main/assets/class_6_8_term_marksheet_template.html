<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SCHOOL_NAME}} — Class {{CLASS}} Term Marksheet</title>
<style>
@page { size: A4 landscape; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; color: #111; font-family: Arial, "Noto Sans Bengali", sans-serif; }
body { font-size: 7pt; }
.panel { width: 297mm; height: 210mm; padding: 3mm; overflow: hidden; page-break-after: always; break-after: page; position: relative; }
.panel:last-child { page-break-after: auto; break-after: auto; }
.school { text-align: center; font-size: 13pt; font-weight: 700; margin: 0 0 1mm; }
.panel:first-child > .school { position: relative; left: 44.55mm; }
.exam { text-align: center; font-size: 9pt; font-weight: 700; margin: 0 0 1mm; }
.meta { text-align: center; font-size: 8pt; margin: 0 0 2mm; }
.part { position: absolute; top: 2mm; right: 3mm; font-size: 6.5pt; color: #444; }
table { width: max-content; min-width: max-content; border-collapse: collapse; table-layout: fixed; font-size: 6.3pt; line-height: 1.05; }
thead { display: table-header-group; }
tr { break-inside: avoid; page-break-inside: avoid; }
th, td { width: 4.5mm; min-width: 4.5mm; max-width: 4.5mm; border: .45px solid #222; padding: 1px .35px; text-align: center; vertical-align: middle; overflow-wrap: anywhere; }
th { background: #e7e7e7; font-weight: 700; }
th.roll, td.roll { width: 8mm; min-width: 8mm; max-width: 8mm; }
th.name, td.name { width: 28mm; min-width: 28mm; max-width: 28mm; text-align: left; }
td.name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
tbody tr { height: 3.35mm; }
th.grand, td.grand { background: #dedede; font-weight: 700; }
td.summary-num { font-weight: 600; }
.signatures { display: flex; align-items: flex-end; font-size: 7.5pt; margin-top: 7mm; }
.signature { width: 35mm; max-width: 35%; border-top: .7px solid #222; padding-top: 1.5mm; text-align: center; }
.left-sign { margin-left: 8mm; }
.right-sign { margin-left: 0; }
.note { margin-top: 2mm; font-size: 6pt; text-align: center; color: #444; }
.right-panel { width: 297mm; padding-left: 3mm; padding-right: 3mm; }
/* Keep the continuation sheet at the same physical scale as page one.
   The table is NOT compressed to the 30% glue strip; each mark cell remains
   4.5mm wide. The remaining columns sit at the left edge of the second A4. */
.right-panel table { width: max-content; min-width: max-content; max-width: none; table-layout: fixed; font-size: 6.3pt; }
.right-panel th, .right-panel td { padding: 1px .35px; overflow-wrap: anywhere; word-break: break-word; }
.right-panel > table { margin-top: 15mm; }
.right-panel .exam, .right-panel .meta { display: none; }
.right-panel .part { display: none; }
.right-panel .signature { width: 35mm; max-width: 35%; }
.right-panel .right-sign { margin-left: 0; }
</style>
</head>
<body>
<section class="panel">
  <h1 class="school">Amtoli Model School</h1>
  <div class="meta">Class: {{CLASS}} &nbsp;&nbsp; Section: {{SECTION}}</div>
  <div class="exam">{{EXAM_LABEL}}</div>
  <table><thead><tr>{{LEFT_HEADERS_TOP}}</tr><tr>{{LEFT_HEADERS_SUB}}</tr></thead><tbody>{{LEFT_ROWS}}</tbody></table>
  <div class="signatures"><div class="signature left-sign">Class Teacher</div></div>
</section>
<section class="panel right-panel">
  <table><thead><tr>{{RIGHT_HEADERS_TOP}}</tr><tr>{{RIGHT_HEADERS_SUB}}</tr></thead><tbody>{{RIGHT_ROWS}}</tbody></table>
  <div class="signatures"><div class="signature right-sign">Head Teacher</div></div>
</section>
</body>
</html>
