<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amtoli Model School Result Card — Term and Annual</title>
<style>
@page { size: A4 portrait; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: Arial, "Noto Sans Bengali", sans-serif; color: #000; background: #fff; }
body { font-size: 8.5pt; line-height: 1.22; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.card { width: 180mm; min-height: 267mm; margin: 15mm auto; border: 1px solid #000; padding: 3.5mm; background: #fff; page-break-after: always; break-after: page; overflow: visible; }
.card:last-child { page-break-after: auto; break-after: auto; }
@media print {
  html, body { width: 210mm; margin: 0; padding: 0; background: #fff; }
  .card { width: 180mm; min-height: 267mm; margin: 15mm auto; page-break-inside: avoid; }
}
.header { display: grid; grid-template-columns: 20mm minmax(0,1fr) 39mm; align-items: center; gap: 2.5mm; border-bottom: 1.2px solid #000; padding-bottom: 2mm; }
.logo { width: 18mm; height: 18mm; object-fit: contain; filter: grayscale(1); }
.school { text-align: center; min-width: 0; }
.school h1 { font-size: 15pt; line-height: 1.1; margin: 0 0 1.2mm; letter-spacing: .2px; font-weight: 700; }
.school p { margin: .6mm 0; font-size: 8pt; }
.scale { border-collapse: collapse; width: 100%; font-size: 6.2pt; table-layout: fixed; }
.scale th, .scale td { border: .6px solid #000; padding: 1px; text-align: center; }
.scale th { font-weight: 700; background: #eee; }
.title { text-align: center; font-size: 12.5pt; font-weight: 700; letter-spacing: .5px; margin: 2.5mm 0; }
.examline { display: flex; justify-content: space-between; gap: 3mm; border: 1px solid #000; padding: 1.7mm 2mm; margin-bottom: 2mm; font-size: 8pt; }
.info { width: 100%; border-collapse: collapse; margin-bottom: 2mm; table-layout: fixed; }
.info th { background: #e9e9e9; text-align: center; font-size: 7.5pt; letter-spacing: .2px; }
.info th, .info td { border: .7px solid #000; padding: 1.15mm 1.6mm; width: 50%; vertical-align: middle; overflow-wrap: anywhere; }
.section-title { text-align: center; font-weight: 700; margin: 2mm 0 1mm; font-size: 9pt; letter-spacing: .25px; }
.marks { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 7.5pt; }
.marks thead { display: table-header-group; }
.marks tr { break-inside: avoid; page-break-inside: avoid; }
.marks th, .marks td { border: .7px solid #000; padding: 1mm .7mm; text-align: center; vertical-align: middle; overflow-wrap: anywhere; }
.marks th { background: #e9e9e9; font-weight: 700; }
.marks th:nth-child(1), .marks td:nth-child(1) { width: 6%; }
.marks th:nth-child(2), .marks td:nth-child(2) { width: 31%; text-align: left; }
.marks th:nth-child(3), .marks td:nth-child(3) { width: 10%; }
.marks th:nth-child(4), .marks td:nth-child(4) { width: 9%; }
.marks th:nth-child(5), .marks td:nth-child(5) { width: 9%; }
.marks th:nth-child(6), .marks td:nth-child(6) { width: 11%; }
.marks th:nth-child(7), .marks td:nth-child(7) { width: 10%; }
.marks th:nth-child(8), .marks td:nth-child(8) { width: 14%; }
.marks .summary td { font-weight: 700; background: #f5f5f5; }
.summary td:first-child { text-align: left; }
.marks .summary td:not(:first-child) { text-align: center !important; vertical-align: middle; }
.comment { margin-top: 2.5mm; border: 1px solid #000; min-height: 12mm; padding: 2mm; }
.signatures { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6mm; margin-top: 11mm; text-align: center; font-size: 7.5pt; }
.signature { border-top: 1px solid #000; padding-top: 1.5mm; min-width: 0; }
.small { font-size: 7.5pt; }
@media screen { body { background: #f3f3f3; } .card { background: #fff; box-shadow: 0 1mm 4mm rgba(0,0,0,.12); } }
</style></head><body><main id="cards">{{CARDS}}</main></body></html>
